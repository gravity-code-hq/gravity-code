npmRebuild: false
appId: sh.gravity.desktop
productName: Gravity
executableName: Gravity
protocols:
  - name: Gravity agent link
    schemes:
      - gravity
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@gravity/*/src/**"
  - "!node_modules/@gravity/**/*.test.*"
  - "!node_modules/@gravity/**/*.spec.*"
  - "!node_modules/@gravity/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@gravity/*/.debug/**"
  - "!node_modules/@gravity/*/.tasks/**"
  - "!node_modules/@gravity/*/conversations/**"
  - "!node_modules/@gravity/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@gravity/server/dist/server/terminal/shell-integration/**/*
  # ripgrep must run from disk; VS Code rewrites the asar path to the unpacked copy.
  - node_modules/@vscode/ripgrep*/bin/**
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: gravity-code-hq
  repo: gravity
mac:
  artifactName: "Gravity-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/gravity
      to: bin/gravity
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Gravity-${version}-${arch}.${ext}"
  maintainer: "Gravity Code <22559884+shreeshiv@users.noreply.github.com>"
  vendor: "Gravity"
  extraResources:
    - from: bin/gravity
      to: bin/gravity
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Gravity"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/gravity CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Gravity-${arch}.${ext}"
win:
  artifactName: "Gravity-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/gravity.cmd
      to: bin/gravity.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
