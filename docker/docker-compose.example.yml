# Minimal Gravity daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change GRAVITY_PASSWORD first.
services:
  gravity:
    image: ghcr.io/gravity-code-hq/gravity:latest
    container_name: gravity
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      GRAVITY_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # GRAVITY_HOSTNAMES: "gravity.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./gravity-home:/home/gravity
      # Code visible to Gravity and the agents it launches.
      - ./workspace:/workspace
